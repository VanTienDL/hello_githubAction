name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lint
        run: flake8 app.py
  build:
    runs-on: ubuntu-latest
    needs: [test,lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build container
      run: docker build -t my-python-app .

    - name: Run container
      run: docker run --rm my-python-app
